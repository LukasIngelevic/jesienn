<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autumn</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <head>
        <div class="logo">
            <p class="logoo">Logo</p>
        </div>
        <nav>
            <a href="index.html">News</a>
            
            <a href="index2.html">Photo Gallery</a>
         
            <a href="index3.html">Registration</a>
        </nav>
        <div class="img1"><img src="images/autum_large.jpg" alt="autumn large"> </div>

    </head>
    <main>
        <h1>Registration</h1>


        <form>
            <fieldset> <legend>RegForm</legend> 
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter Name Here">
                <br>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password Here">
                <br>

                <label for="Email">Email</label>
                <input type="Email" id="Email" placeholder="Enter Email Here">
                <br>
                <label for="date">Date</label>
                <input type="date" id="Date">
                <br>
                <label for="phone">PhoneNo.</label>
                <input type="number" id="phone">
                <br> 
                <label for="file">SelectFile</label>
                <input type="file" id="file"    >
                <br>
                <label > Gender</label>
                <input type="radio" name="gender" id="male">
                <label for="male"> Male</label>
                <input type="radio" name="gender" id="female">
                <label for="female">Female</label>
                <br>
                <label>Language</label>
                <input type="checkbox" id="hindi">
                <label for="hindi">Hindi</label>
                <input type="checkbox" id="english">
                <label for="english">English</label>
                <br>
                <label for="course"> Course</label>
                <select id="course">
                    <option >CS</option>
                    <option >IT</option>
                    <option >Engineering</option>

                </select>
                <br>
                <label for="comment">Comment</label>
                <textarea id="comment"></textarea>
                <br>
                <button type="submit">RegisterNow</button>
                <button type="reset">Refresh</button>
                

            
            </fieldset>
        </form>
        
     

    </main>

    <footer>
<div>Copyright Vardenis Pavardenis</div>
    </footer>
</body>
</html>
